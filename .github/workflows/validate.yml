name: Validate Index

# Runs on pushes to main as well as PRs: index entries are often pushed
# straight to main when a package is released, and those were never
# validated before.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'index.json'
      - 'scripts/validate_index.py'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'index.json'
      - 'scripts/validate_index.py'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run index validator
        run: python3 scripts/validate_index.py
